<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a5276"/>
      <stop offset="100%" style="stop-color:#0e2f44"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f1c40f"/>
      <stop offset="100%" style="stop-color:#e67e22"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  
  <!-- Outer ring -->
  <circle cx="256" cy="200" r="140" fill="none" stroke="url(#gold)" stroke-width="5"/>
  
  <!-- Inner ring -->
  <circle cx="256" cy="200" r="120" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.4"/>
  
  <!-- Book icon -->
  <path d="M176 180 L256 155 L336 180 L336 255 L256 280 L176 255 Z" fill="none" stroke="#f1c40f" stroke-width="4" stroke-linejoin="round"/>
  <line x1="256" y1="155" x2="256" y2="280" stroke="#f1c40f" stroke-width="3"/>
  
  <!-- ASSO.P.E -->
  <text x="256" y="350" text-anchor="middle" fill="#f1c40f" font-size="64" font-weight="bold" font-family="Arial, sans-serif">ASSO.P.E</text>
  
  <!-- ECOLE -->
  <text x="256" y="400" text-anchor="middle" fill="#ecf0f1" font-size="42" font-weight="bold" font-family="Arial, sans-serif">ECOLE</text>
  
  <!-- HADJ MESSAOUD SAID -->
  <text x="256" y="445" text-anchor="middle" fill="#ecf0f1" font-size="36" font-family="Arial, sans-serif">HADJ MESSAOUD SAID</text>
  
  <!-- EL-ATTEUF -->
  <text x="256" y="490" text-anchor="middle" fill="#95a5a6" font-size="30" font-family="Arial, sans-serif">EL-ATTEUF</text>
</svg>
