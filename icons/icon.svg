<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#1a5276"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f1c40f"/>
      <stop offset="100%" style="stop-color:#e67e22"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  
  <!-- Outer circle -->
  <circle cx="256" cy="230" r="180" fill="none" stroke="url(#gold)" stroke-width="6"/>
  
  <!-- Inner circle -->
  <circle cx="256" cy="230" r="160" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.4"/>
  
  <!-- Text lines -->
  <text x="256" y="155" text-anchor="middle" fill="#f1c40f" font-size="62" font-weight="bold" font-family="Arial, sans-serif">جمعية</text>
  
  <text x="256" y="210" text-anchor="middle" fill="#f1c40f" font-size="48" font-weight="bold" font-family="Arial, sans-serif">أولياء التلاميذ</text>
  
  <text x="256" y="260" text-anchor="middle" fill="#ecf0f1" font-size="34" font-family="Arial, sans-serif">إبتدائية الشيخ</text>
  
  <text x="256" y="300" text-anchor="middle" fill="#ecf0f1" font-size="34" font-family="Arial, sans-serif">حاج مسعود سعيد</text>
  
  <!-- Location -->
  <text x="256" y="345" text-anchor="middle" fill="#95a5a6" font-size="24" font-family="Arial, sans-serif">بلدية العطف - تجنينت - غرداية</text>
  
  <!-- Decorative arc -->
  <path d="M120 400 Q256 440 392 400" fill="none" stroke="url(#gold)" stroke-width="4"/>
</svg>
