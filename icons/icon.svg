<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a5276"/>
      <stop offset="100%" style="stop-color:#0e2f44"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f1c40f"/>
      <stop offset="100%" style="stop-color:#e67e22"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  
  <!-- Outer circle -->
  <circle cx="256" cy="200" r="130" fill="none" stroke="url(#gold)" stroke-width="6"/>
  
  <!-- Inner decoration -->
  <circle cx="256" cy="200" r="115" fill="none" stroke="#f1c40f" stroke-width="1.5" opacity="0.3"/>
  
  <!-- Book icon -->
  <path d="M180 170 L256 140 L332 170 L332 250 L256 280 L180 250 Z" fill="none" stroke="#f1c40f" stroke-width="4" stroke-linejoin="round"/>
  <line x1="256" y1="140" x2="256" y2="280" stroke="#f1c40f" stroke-width="3"/>
  
  <!-- Main text -->
  <text x="256" y="360" text-anchor="middle" fill="#f1c40f" font-size="56" font-weight="bold" font-family="Arial, sans-serif">M.E.T</text>
  
  <!-- School name -->
  <text x="256" y="400" text-anchor="middle" fill="#ecf0f1" font-size="30" font-family="Arial, sans-serif">ECOLE HADJ MESSAOUD SAID</text>
  
  <!-- Location -->
  <text x="256" y="440" text-anchor="middle" fill="#95a5a6" font-size="22" font-family="Arial, sans-serif">EL ATF - GHARDAIA</text>
  
  <!-- Decorative line -->
  <line x1="160" y1="460" x2="352" y2="460" stroke="#f1c40f" stroke-width="2" opacity="0.5"/>
</svg>
