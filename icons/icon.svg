<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f0f0f0"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="250" fill="url(#bg)" stroke="#2196F3" stroke-width="8"/>
  
  <!-- School building - yellow -->
  <path d="M120 280 L120 150 L256 90 L392 150 L392 280 Z" fill="#FFC107" stroke="#5D4037" stroke-width="4" stroke-linejoin="round"/>
  
  <!-- Roof -->
  <path d="M100 160 L256 80 L412 160" fill="none" stroke="#5D4037" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Door -->
  <rect x="220" y="200" width="72" height="80" fill="#5D4037" rx="4"/>
  <rect x="228" y="208" width="56" height="64" fill="#8D6E63" rx="2"/>
  
  <!-- Windows -->
  <rect x="145" y="180" width="45" height="45" fill="#81D4FA" stroke="#5D4037" stroke-width="3" rx="3"/>
  <rect x="322" y="180" width="45" height="45" fill="#81D4FA" stroke="#5D4037" stroke-width="3" rx="3"/>
  
  <!-- Globe - blue -->
  <circle cx="380" cy="130" r="55" fill="none" stroke="#2196F3" stroke-width="5"/>
  <ellipse cx="380" cy="130" rx="30" ry="55" fill="none" stroke="#2196F3" stroke-width="3"/>
  <line x1="325" y1="130" x2="435" y2="130" stroke="#2196F3" stroke-width="3"/>
  <line x1="340" y1="100" x2="420" y2="100" stroke="#2196F3" stroke-width="2"/>
  <line x1="340" y1="160" x2="420" y2="160" stroke="#2196F3" stroke-width="2"/>
  
  <!-- Parent figure - blue -->
  <circle cx="300" cy="240" r="22" fill="#2196F3"/>
  <line x1="300" y1="262" x2="300" y2="340" stroke="#2196F3" stroke-width="10" stroke-linecap="round"/>
  <line x1="300" y1="285" x2="260" y2="310" stroke="#2196F3" stroke-width="8" stroke-linecap="round"/>
  <line x1="300" y1="285" x2="340" y2="310" stroke="#2196F3" stroke-width="8" stroke-linecap="round"/>
  <line x1="300" y1="340" x2="270" y2="400" stroke="#2196F3" stroke-width="8" stroke-linecap="round"/>
  <line x1="300" y1="340" x2="330" y2="400" stroke="#2196F3" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Child figure - red -->
  <circle cx="380" cy="300" r="18" fill="#E53935"/>
  <line x1="380" y1="318" x2="380" y2="380" stroke="#E53935" stroke-width="8" stroke-linecap="round"/>
  <line x1="380" y1="338" x2="350" y2="360" stroke="#E53935" stroke-width="6" stroke-linecap="round"/>
  <line x1="380" y1="338" x2="410" y2="360" stroke="#E53935" stroke-width="6" stroke-linecap="round"/>
  <line x1="380" y1="380" x2="358" y2="430" stroke="#E53935" stroke-width="6" stroke-linecap="round"/>
  <line x1="380" y1="380" x2="402" y2="430" stroke="#E53935" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Orange waves at bottom -->
  <path d="M80 440 Q160 410 256 440 Q352 470 432 440" fill="none" stroke="#FF9800" stroke-width="6" stroke-linecap="round"/>
  <path d="M100 460 Q180 430 256 460 Q332 490 412 460" fill="none" stroke="#FF9800" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Text -->
  <text x="256" y="490" text-anchor="middle" fill="#333" font-size="18" font-family="Arial, sans-serif">العطف - غرداية - الجزائر</text>
